[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ecopipeline"
version = "2.3.0"
description = "Contains functions for use in Ecotope Datapipelines"
readme = "README.md"
requires-python = ">=3.11,<3.12"
authors = [
    { name = "Carlos Bello", email = "bellocarlos@seattleu.edu" },
    { name = "Emil Fahrig", email = "fahrigemil@seattleu.edu" },
    { name = "Casey Mang", email = "cmang@seattleu.edu" },
    { name = "Julian Harris", email = "harrisjulian@seattleu.edu" },
    { name = "Roger Tram", email = "rtram@seattleu.edu" },
    { name = "Nolan Price", email = "nolan@ecotope.com" },
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: GNU General Public License (GPL)",
    "Operating System :: OS Independent",
]

# Floors track the current release of each package; ceilings stop the next
# major from arriving unannounced. Consumers install this package into shared,
# long-lived environments where an unbounded range lets a routine `pip install`
# pull in a breaking major release.
dependencies = [
    "numpy>=2.4,<3.0",
    "pandas>=3.0,<4.0",
    "scikit-learn>=1.9,<2.0",
    "mysql-connector-python>=26.7,<27.0",
    "openmeteo_requests>=1.7,<2.0",
    "requests>=2.34,<3.0",
    "pytz>=2026.3",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-mock",
    "build",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"ecopipeline.utils.pkls" = ["*.pkl"]
"ecopipeline.extract" = ["zip_to_lat_long.csv"]
