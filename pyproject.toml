[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ecopipeline"
version = "2.2.3"
description = "Contains functions for use in Ecotope Datapipelines"
readme = "README.md"
requires-python = ">=3.11,<3.12"
authors = [
    { name = "Carlos Bello", email = "bellocarlos@seattleu.edu" },
    { name = "Emil Fahrig", email = "fahrigemil@seattleu.edu" },
    { name = "Casey Mang", email = "cmang@seattleu.edu" },
    { name = "Julian Harris", email = "harrisjulian@seattleu.edu" },
    { name = "Roger Tram", email = "rtram@seattleu.edu" },
    { name = "Nolan Price", email = "nolan@ecotope.com" },
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: GNU General Public License (GPL)",
    "Operating System :: OS Independent",
]

# Upper bounds are deliberate. Consumers install this package into shared,
# long-lived environments, so an unbounded range lets a routine `pip install`
# pull in an incompatible major release (numpy 2.x against pandas 1.5.x being
# the recurring case). numpy is held to the 1.24 patch series because that is
# the only series this code has been exercised against.
dependencies = [
    "numpy~=1.24.1",
    "pandas>=1.5.3,<2.0",
    "scikit-learn>=1.2.1,<2.0",
    "mysql-connector-python>=8.0.32,<9.0",
    "openmeteo_requests>=1.7,<2.0",
    "requests>=2.28,<3.0",
    "pytz",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-mock",
    "build",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"ecopipeline.utils.pkls" = ["*.pkl"]
"ecopipeline.extract" = ["zip_to_lat_long.csv"]
